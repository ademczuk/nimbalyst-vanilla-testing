# Knowledge graph predicate registry (software domain).
#
# The verbs a software-domain graph is allowed to use. This is the ontology,
# and it is deliberately small: a predicate earns its place by having qualifiers
# that a reader needs in order to act on the statement. "Product A integrates
# with Product B" is close to useless on its own; "via which connector, for
# which operations, tested against which version" is the part someone can use.
#
# Every subject is declared against `entity` rather than against a narrowed
# kind: domains are values of `entity.kind`, so a new domain satisfies these
# with no edit here.
predicates:
  - id: integrates-with
    label: integrates with
    inverseLabel: is integrated by
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
    transitive: false
    qualifiers:
      via:
        type: relationship
        targetTrackerTypes: [entity]
        required: true
        label: Via
        description: The connector or mechanism the integration runs through.
      operations:
        type: array
        itemType: string
        required: true
        label: Operations
        description: What the integration can actually do. An integration with no named operations is a logo on a page.
      authentication:
        type: string
        label: Authentication
      testedClientVersion:
        type: string
        label: Tested client version
        description: The version this was observed against. Absent means documented, not observed.

  - id: implements-protocol
    label: implements
    inverseLabel: is implemented by
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
    qualifiers:
      role:
        type: select
        options: [client, server, both]
        required: true
        label: Role
      specVersion:
        type: string
        label: Spec version

  - id: provided-by
    label: is provided by
    inverseLabel: provides
    subjectKinds: [entity]
    valueShape: entity
    direction: directed

  - id: component-of
    label: is a component of
    inverseLabel: has component
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
    transitive: true

  - id: requires
    label: requires
    inverseLabel: is required by
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
    qualifiers:
      optional:
        type: boolean
        label: Optional
        description: True when the requirement is only for a subset of use.
      minimumVersion:
        type: string
        label: Minimum version

  - id: imports-format
    label: imports
    inverseLabel: is imported by
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
    qualifiers:
      fidelity:
        type: select
        options: [full, partial, lossy, unknown]
        label: Fidelity

  - id: exports-format
    label: exports
    inverseLabel: is exported by
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
    qualifiers:
      fidelity:
        type: select
        options: [full, partial, lossy, unknown]
        label: Fidelity

  # `boolean-assessment`, not `boolean`, on purpose: support has to be able to
  # say "partial" and "unknown". Collapsing those to false is how a documented
  # gap becomes a recorded denial.
  - id: supports-capability
    label: supports
    inverseLabel: is supported by
    subjectKinds: [entity]
    valueShape: boolean-assessment
    direction: directed
    qualifiers:
      level:
        type: select
        options: [full, partial, none, unknown]
        required: true
        label: Level
      surface:
        type: string
        label: Surface
        description: Where the capability is available -- desktop, web, CLI, mobile.

  # --- Market, maker and competition -------------------------------------
  #
  # "Competitor" is a relationship, not a location: Nimbalyst competes with a
  # product IN a market, at a threat level that belongs to that market.

  - id: in-market
    label: is in market
    inverseLabel: includes
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
    qualifiers:
      primary:
        type: boolean
        label: Primary
        description: The market the product is mainly known for.

  - id: made-by
    label: is made by
    inverseLabel: makes
    subjectKinds: [entity]
    valueShape: entity
    direction: directed

  - id: competes-with
    label: competes with
    inverseLabel: competes with
    subjectKinds: [entity]
    valueShape: entity
    direction: symmetric
    qualifiers:
      market:
        type: relationship
        targetTrackerTypes: [entity]
        label: Market
        description: "The market (kind: market) this competition is in. Threat is per market."
      threat:
        type: select
        options: [low, medium, high, critical]
        label: Threat
      overlap:
        type: string
        label: Overlap
      difference:
        type: string
        label: Difference
      reviewedAt:
        type: date
        label: Reviewed

  - id: inspired-by
    label: is inspired by
    inverseLabel: inspired
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
    qualifiers:
      what:
        type: string
        label: What
        description: The idea or design that was borrowed.

  - id: depends-on
    label: depends on
    inverseLabel: is depended on by
    subjectKinds: [entity]
    valueShape: entity
    direction: directed
    qualifiers:
      risk:
        type: select
        options: [low, medium, high]
        label: Risk

  # --- Dated facts ----------------------------------------------------------
  #
  # A fact is a claim, not a field, because it changes and needs a date and a
  # source. `asOf` is required (`asOfPrecision` says whether it is a day, month
# or year; a month is stored as its first day); the display value goes in `claim.valueText`;
  # quantity facts also carry `amount` and `unit` (USD, people, users, seats);
  # sources go in `claim.citations`. The current value is the latest `asOf`
  # among asserted claims. Organization facts: annual-revenue, funding-total,
  # valuation, last-round, headcount, founded, hq. Product facts: pricing,
  # license, platforms, launched, users, lifecycle.

  - id: annual-revenue
    label: annual revenue
    inverseLabel: annual revenue of
    subjectKinds: [entity]
    valueShape: quantity
    direction: directed
    qualifiers: &quantityFact
      asOf:
        type: date
        required: true
        label: As of
        description: When the value was true. The current value is the latest asOf among asserted claims.
      asOfPrecision: &asOfPrecision
        type: select
        options: [day, month, year]
        label: As-of precision
        description: How precise asOf is. Absent means day. A month-precision date is the first of the month.
      amount:
        type: number
        label: Amount
        description: The number behind valueText, in `unit`.
      unit:
        type: string
        label: Unit
        description: USD, people, users, or seats.

  - id: funding-total
    label: total funding
    inverseLabel: total funding of
    subjectKinds: [entity]
    valueShape: quantity
    direction: directed
    qualifiers: *quantityFact

  - id: valuation
    label: valuation
    inverseLabel: valuation of
    subjectKinds: [entity]
    valueShape: quantity
    direction: directed
    qualifiers: *quantityFact

  - id: last-round
    label: last round
    inverseLabel: last round of
    subjectKinds: [entity]
    valueShape: text
    direction: directed
    qualifiers:
      asOf: &asOf
        type: date
        required: true
        label: As of
        description: When the value was true. The current value is the latest asOf among asserted claims.
      asOfPrecision: *asOfPrecision
      stage:
        type: string
        label: Stage

  - id: headcount
    label: headcount
    inverseLabel: headcount of
    subjectKinds: [entity]
    valueShape: quantity
    direction: directed
    qualifiers: *quantityFact

  - id: founded
    label: founded
    inverseLabel: founded of
    subjectKinds: [entity]
    valueShape: text
    direction: directed
    qualifiers: &textFact
      asOf: *asOf
      asOfPrecision: *asOfPrecision

  - id: hq
    label: headquarters
    inverseLabel: headquarters of
    subjectKinds: [entity]
    valueShape: text
    direction: directed
    qualifiers: *textFact

  - id: pricing
    label: pricing
    inverseLabel: pricing of
    subjectKinds: [entity]
    valueShape: text
    direction: directed
    qualifiers: *textFact

  - id: license
    label: license
    inverseLabel: license of
    subjectKinds: [entity]
    valueShape: text
    direction: directed
    qualifiers: *textFact

  - id: platforms
    label: platforms
    inverseLabel: platforms of
    subjectKinds: [entity]
    valueShape: text
    direction: directed
    qualifiers: *textFact

  - id: launched
    label: launched
    inverseLabel: launched of
    subjectKinds: [entity]
    valueShape: text
    direction: directed
    qualifiers: *textFact

  - id: users
    label: users
    inverseLabel: users of
    subjectKinds: [entity]
    valueShape: quantity
    direction: directed
    qualifiers: *quantityFact

  # `claim.valueText` is one of: active, declining, unmaintained, defunct. A
  # predicate cannot declare a select's options, so the list lives here.
  - id: lifecycle
    label: lifecycle
    inverseLabel: lifecycle of
    subjectKinds: [entity]
    valueShape: select
    direction: directed
    qualifiers: *textFact
